name: MPV (LGPL)
run-name: "${{ inputs.run_name != '' && inputs.run_name || format('LGPL libmpv ({0})', inputs.compiler) }}"

# One LGPL-2.1+ libmpv for Windows x86_64, built from pinned sources.
# Versions live in pins.env; the licence changes live in patches/lgpl.patch.
# Run toolchain.yml first (and llvm.yml before it, for clang): this job
# restores their caches and would otherwise build the compiler itself.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      compiler:
        required: false
        default: "gcc"
        type: choice
        options:
        - clang
        - gcc
      release:
        description: "Publish a release"
        required: false
        default: false
        type: boolean
      run_name:
        description: "The name displayed in the list of workflow runs"
        required: false

env:
  BIT: "64"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build LGPL libmpv
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - name: Install Dependencies
        run: |
          sudo echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" | sudo tee -a /etc/pacman.conf >/dev/null
          sudo pacman-key --init
          sudo pacman-key --populate archlinux
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm --needed git ninja cmake meson clang lld libc++ unzip ragel yasm nasm gperf rst2pdf lib32-gcc-libs lib32-glib2 python-cairo curl wget mimalloc ccache python-pip 7zip shaderc binutils
          sudo pacman -U --noconfirm https://archive.archlinux.org/packages/f/flex/flex-2.6.4-6-x86_64.pkg.tar.zst  # flex 2.6.10+ breaks gcc's gengtype-lex (yybegin macro)
          sudo python -m pip install --break-system-packages roman
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6

      - name: Load pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"

      - name: Checkout recipes at the pinned commit
        uses: actions/checkout@v6
        with:
          repository: Kosm8/mpv-winbuild-cmake
          ref: ${{ env.CMAKE_SHA }}
          path: mpv-winbuild-cmake

      - name: Apply the LGPL patch
        run: |
          set -euo pipefail
          sed -e "s/@FFMPEG_TAG@/${FFMPEG_TAG}/" -e "s/@MPV_TAG@/${MPV_TAG}/" patches/lgpl.patch > /tmp/lgpl.patch
          git -C mpv-winbuild-cmake apply --verbose /tmp/lgpl.patch
          if grep -rn '@[A-Z_]*_TAG@' mpv-winbuild-cmake/packages; then echo "unsubstituted pin"; exit 1; fi
          if grep -n -- '--enable-gpl\|--enable-version3\|--enable-nonfree' mpv-winbuild-cmake/packages/ffmpeg.cmake; then echo "GPL switch left in ffmpeg.cmake"; exit 1; fi
          grep -q -- '-Dgpl=false' mpv-winbuild-cmake/packages/mpv.cmake
          sed -i '/ccache_conf.in/d' mpv-winbuild-cmake/CMakeLists.txt
          sed -i '/ccache/d' mpv-winbuild-cmake/exec.in

      # Compiler caches made by toolchain.yml / llvm.yml. No source or build
      # cache: every run downloads and compiles the pinned sources afresh.
      - name: Restore toolchain cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ github.workspace }}/mpv-winbuild-cmake/build${{ env.BIT }}
          key: toolchain-${{ inputs.compiler }}-build${{ env.BIT }}-none
          restore-keys: |
            toolchain-${{ inputs.compiler }}-build${{ env.BIT }}-
      - name: Restore clang sysroot cache
        if: ${{ inputs.compiler == 'clang' }}
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ github.workspace }}/mpv-winbuild-cmake/clang_root
          key: ${{ env.BIT }}-clang_root-none
          restore-keys: |
            ${{ env.BIT }}-clang_root-
      - name: Restore Rust cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ github.workspace }}/mpv-winbuild-cmake/install_rustup
          key: rust-none
          restore-keys: |
            rust-

      - name: Build
        run: |
          chmod +x build.sh
          cd mpv-winbuild-cmake
          bash ../build.sh -t "$BIT" -c '${{ inputs.compiler }}' -s true

      # Fails the run if anything GPL or nonfree got into the build.
      - name: GPL guard
        run: |
          set -euo pipefail
          b=mpv-winbuild-cmake/build$BIT
          ffcfg="$b/lgpl-evidence/ffmpeg-config.h"
          mpvcfg="$b/lgpl-evidence/mpv-config.h"
          test -s "$ffcfg"
          test -s "$mpvcfg"
          echo "FFmpeg: $ffcfg"; grep -E 'FFMPEG_CONFIGURATION|FFMPEG_LICENSE' "$ffcfg"
          grep -qx '#define FFMPEG_LICENSE "LGPL version 2.1 or later"' "$ffcfg"
          grep -qx '#define CONFIG_GPL 0' "$ffcfg"
          grep -qx '#define CONFIG_NONFREE 0' "$ffcfg"
          grep -qx '#define CONFIG_VERSION3 0' "$ffcfg"
          if grep 'FFMPEG_CONFIGURATION' "$ffcfg" | grep -E -- '--enable-(gpl|nonfree|version3|libx264|libx265|libxvid|librubberband|libvidstab|frei0r|avisynth|libdvdnav|libdvdread|libcdio|libfdk-aac)'; then
            echo "GPL/nonfree option in FFmpeg configuration"; exit 1
          fi
          echo "mpv: $mpvcfg"; grep -E 'HAVE_GPL ' "$mpvcfg"
          grep -qx '#define HAVE_GPL 0' "$mpvcfg"
          dev=$(find mpv-winbuild-cmake/release -name 'mpv-dev-*.7z' | head -1)
          test -n "$dev"
          mkdir -p /tmp/dev && 7z x -y -o/tmp/dev "$dev" >/dev/null
          s=$(strings -a /tmp/dev/libmpv-2.dll)
          # Informational: libmpv never calls avutil_license(), so LTO usually
          # strips FFmpeg's licence string; config.h above is the evidence.
          if echo "$s" | grep -qx 'LGPL version 2.1 or later'; then echo "DLL: LGPL licence string present"; else echo "DLL: no FFmpeg licence string (stripped)"; fi
          if echo "$s" | grep -Ex 'GPL version [23] or later|LGPL version 3 or later|nonfree and unredistributable'; then
            echo "libmpv-2.dll carries a GPL/nonfree FFmpeg licence string"; exit 1
          fi
          echo "GPL guard passed"

      - name: Collect release files
        run: |
          set -euo pipefail
          out=dist; mkdir -p "$out/config"
          b=mpv-winbuild-cmake/build$BIT
          cp "$(find mpv-winbuild-cmake/release -name 'mpv-dev-*.7z' | head -1)" "$out/"
          cp "$b"/lgpl-evidence/* "$out/config/"
          cp pins.env patches/lgpl.patch LICENSES.md "$out/"
          # Corresponding source: every compiled package plus the scripts that
          # control the build (this repo and the patched recipes).
          git -C mpv-winbuild-cmake diff > "$out/recipes-applied.diff"
          7z a -mx=9 -xr'!.git' "$out/source-mpv-${MPV_TAG}-ffmpeg-${FFMPEG_TAG}.7z" \
            ./mpv-winbuild-cmake/src_packages ./mpv-winbuild-cmake/packages ./mpv-winbuild-cmake/cmake \
            ./mpv-winbuild-cmake/toolchain ./mpv-winbuild-cmake/CMakeLists.txt ./build.sh ./pins.env ./patches >/dev/null
          (cd "$out" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS)
          ls -la "$out" "$out/config"

      - name: Collect logs
        if: ${{ always() }}
        run: |
          7z a logs.7z $(find mpv-winbuild-cmake/build$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") || true
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs.7z
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: lgpl-libmpv
          path: dist

  publish_release:
    name: Publish release
    needs: [build]
    if: ${{ inputs.release == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: lgpl-libmpv
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lgpl-mpv-${MPV_TAG}-ffmpeg-${FFMPEG_TAG}-r${{ github.run_number }}"
          {
            echo "LGPL-2.1+ libmpv for Windows x86_64."
            echo
            echo "- mpv \`${MPV_TAG}\` (-Dgpl=false), FFmpeg \`${FFMPEG_TAG}\` (no --enable-gpl / version3 / nonfree)"
            echo "- Recipes: Kosm8/mpv-winbuild-cmake@\`${CMAKE_SHA}\` + patches/lgpl.patch"
            echo "- The source archive holds every compiled package and the build scripts. Licences: LICENSES.md. Checksums: SHA256SUMS."
          } > notes.md
          mapfile -t files < <(find dist -type f | sort)
          gh release create "$tag" "${files[@]}" --title "$tag" --notes-file notes.md --target "${{ github.sha }}"
